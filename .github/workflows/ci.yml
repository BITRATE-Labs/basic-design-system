name: CI
on:
  pull_request:
  push:
    branches: [main, next]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Screenshot baselines are only valid in this image. Keep its tag equal to the
    # @playwright/test version in package.json (update-visual-baselines.yml too).
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:tokens
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run registry:check
      - run: npm run build-storybook
      - run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
