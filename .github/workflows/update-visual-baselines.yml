name: Update visual baselines
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate baselines on and commit to
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: update-visual-baselines-${{ inputs.branch }}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image as ci.yml; keep its tag equal to the @playwright/test version.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      # Start clean so baselines of deleted stories go too.
      - run: rm -rf tests/visual/__screenshots__
      - run: npm run test:visual -- --update-snapshots=all
      - name: Commit baselines
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
            exit 0
          fi
          git commit -m "Update visual baselines"
          git push origin "HEAD:refs/heads/$BRANCH"
