name: Update visual baselines
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate baselines on and commit to
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: update-visual-baselines-${{ inputs.branch }}
jobs:
  # Runs the branch's own code (npm ci, Storybook build) with a read-only token.
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image as ci.yml; keep its tag equal to the @playwright/test version.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - name: Require a branch name
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in
            refs/* | *..* | -*) echo "Give a branch name, not a ref: $BRANCH"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ inputs.branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      # Start clean so baselines of deleted stories go too.
      - run: rm -rf tests/visual/__screenshots__
      - run: npm run test:visual -- --update-snapshots=all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
          if-no-files-found: error
          retention-days: 1

  # Holds the write token and runs no code from the branch.
  commit:
    needs: screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ inputs.branch }}
      - run: rm -rf tests/visual/__screenshots__
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
      - name: Commit baselines
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
            exit 0
          fi
          git commit -m "Update visual baselines"
          # A push made with GITHUB_TOKEN starts no workflow run, so CI does not run on
          # this commit by itself. The README says how to re-run it.
          git push origin "HEAD:refs/heads/$BRANCH"
